model_path: models/base/qwen3.5-0.8b-nli-v5
run_dir: runs/single
iterations: 100
group_size: 16
rollout_steps: 256
learning_rate: 5.0e-06
head_learning_rate: 1.0e-05
lora_rank: 16
lora_alpha: 32
clip_epsilon: 0.2
entropy_coefficient: 0.03
update_epochs: 2
history_window: 8
max_tokens: 512
checkpoint_every: 5
eval_every: 5
eval_steps: 200
seed: 20260924
rules: 'Overcooked: serve 3-onion soups. Collect and deposit 3 onions, start cooking
  empty-handed, get a plate, plate ready soup, serve. Choose ONE native button. A
  direction turns and moves one free tile; interact uses the faced adjacent tile.
  Carry one item. Coordinates increase right/down. Object locations are relative to
  you. An unlocated object may be absent or suppressed because you hold it.'
actions:
- stay
- up
- down
- left
- right
- interact
hypothesis: The chef should press {action} next.
duration_hours: 100
gradient_checkpointing: false
microbatch_states: 8
optimizer_batch_size: 128
target_kl: 0.03
initial_checkpoint: null
fast_convolution: true
mixed_precision: true
shared_prefix: true
rollout_batch_states: 16
inhibit_suspend: false
training_token_budget: 3000
reward_scheme: native_cooking_v1_generic_exploration_v4
environment: overcooked_cramped_room_single_agent_v1
reward_values:
  onion_deposited: 0.1
  correct_pot_started: 0.1
  soup_plated: 0.2
  correct_soup_served: 1.0
  pickup: 0.0
  movement: 0.0
  waiting: 0.0
liger_kernels: true
explicit_masks: true
credit_assignment: reward_to_go
discount_gamma: 0.995
novelty_bonus: 0.01
novelty_episode_cap: 0.3
novelty_segment_cap: 0.05
novelty_quantization: 0.1
adaptive_entropy: true
entropy_target: 1.45
entropy_adaptation_rate: 0.2
entropy_min: 0.02
entropy_max: 0.2
repeated_noop_penalty: 0.01
stuck_entropy_gain: 1.0
stuck_entropy_cap: 4
