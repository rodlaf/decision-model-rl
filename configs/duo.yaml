model_path: models/base/qwen3.5-0.8b-nli-v5
initial_adapter: models/trained/single-chef
source_run: single-chef stage
source_best_iteration: 330
source_best_soups: 4
run_dir: runs/duo
environment: overcooked_cramped_room_two_model_chefs_v1
prompt_version: duo_actor_v2_adjacent_teammate_blocking
num_agents: 2
group_size: 8
rollout_steps: 512
learning_rate: 5.0e-06
head_learning_rate: 1.0e-05
lora_rank: 16
lora_alpha: 32
clip_epsilon: 0.2
entropy_coefficient: 0.05
update_epochs: 2
history_window: 8
max_tokens: 512
checkpoint_every: 5
eval_every: 5
eval_steps: 512
seed: 20260925
rules: 'Cooperative Overcooked: you are one of two autonomous chefs working together
  to serve 3-onion soups. You choose only your own action. Your teammate independently
  chooses their action at the same time, and you share the soup reward. Collect and
  deposit 3 onions, start cooking empty-handed, get a plate, plate ready soup, and
  serve it. Choose ONE native button for yourself. A direction turns and moves one
  free tile; interact uses the faced adjacent tile. Carry one item. Coordinate with
  your teammate and avoid collisions. Coordinates increase right/down. Object locations
  are relative to you. An unlocated object may be absent or suppressed because you
  hold it.'
actions:
- stay
- up
- down
- left
- right
- interact
hypothesis: Your next action should be {action}.
duration_hours: 100
gradient_checkpointing: false
microbatch_states: 8
optimizer_batch_size: 128
target_kl: 0.03
fast_convolution: true
mixed_precision: true
shared_prefix: true
rollout_batch_states: 16
inhibit_suspend: false
training_token_budget: 3000
reward_scheme: pufferlib_per_agent_cooperative_v1_generic_exploration_v4
liger_kernels: true
explicit_masks: true
credit_assignment: reward_to_go
discount_gamma: 0.995
novelty_bonus: 0.01
novelty_episode_cap: 0.3
novelty_segment_cap: 0.05
novelty_quantization: 0.1
adaptive_entropy: true
entropy_target: 1.45
entropy_adaptation_rate: 0.2
entropy_min: 0.02
entropy_max: 0.2
repeated_noop_penalty: 0.01
stuck_entropy_gain: 1.0
stuck_entropy_cap: 4
